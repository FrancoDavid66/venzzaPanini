    <!-- Modo Día / Noche: se aplica antes de pintar la página (evita el parpadeo).
         Noche de 18 a 7 hs (hora de Buenos Aires) → mantener igual que modoNoche en src/data/negocio.js -->
    <script>
      (function () {
        try {
          var tema = sessionStorage.getItem('venzza-tema');
          if (!tema) {
            var hora = Number(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Argentina/Buenos_Aires',
                hour: 'numeric',
                hourCycle: 'h23',
              }).format(new Date())
            ) % 24;
            tema = hora >= 18 || hora < 7 ? 'noche' : 'dia';
          }
          if (tema === 'noche') {
            document.documentElement.classList.add('noche');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1B241D');
          }
        } catch (e) {}
      })();
    </script>
